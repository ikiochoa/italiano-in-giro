[build]
  publish = "web"

# netlify/functions/topic-words.mjs (Claude writes word lists); packages come from package.json
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always check for a new version, so updates reach phones right away.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
